<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cursapp · Apoderado</title>

  <link rel="stylesheet" href="assets/styles.css?v=400">
  <link rel="stylesheet" href="assets/apoderado.css?v=30">
</head>
<body>

<header>
  <div class="topbar" style="position:relative;">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <div id="whoRoleTitle" style="font-weight:950;">Rol: Apoderado</div>
        <div class="muted" style="font-weight:800;font-size:12px;" id="whoCourseLine">—</div>
      </div>
    </div>

    <button class="btn ghost" id="menuBtn" type="button"
      style="position:absolute;right:16px;top:10px;z-index:10001;">☰</button>

    <div id="menuDropdown"
      style="display:none;position:absolute;right:16px;top:56px;background:#fff;border:1px solid rgba(229,231,235,.9);
      border-radius:14px;padding:8px;min-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:10002;">
      <button class="btn ghost" id="goOnboarding" type="button" style="width:100%;text-align:left;">Configurar curso</button>
      <button class="btn ghost" type="button" style="width:100%;text-align:left;"
  onclick="CURSAPP_SWITCH.toDirectiva()">
  🧑‍💼 Volver a directiva
</button>
      <button class="btn ghost" type="button" style="width:100%;text-align:left;" onclick="CURSAPP.hardReset()">
  🧨 Reset total (dev)
</button>
      <button class="btn ghost" type="button" style="width:100%;text-align:left;" onclick="openHelp()">❓ Ayuda</button>
      <button class="btn ghost" id="logoutBtn" type="button" style="width:100%;text-align:left;">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="container" id="app"></main>
<div id="modalRoot"></div>

<nav class="bottomNav">
  <button class="navItem active" data-tab="home">🏠<span>Inicio</span></button>
  <button class="navItem" data-tab="payments">💳<span>Pagos</span></button>
  <button class="navItem" data-tab="informes">📄<span>Informes</span></button>
</nav>
<script defer src="/assets/config.js?v=1"></script>
<script defer src="/assets/apoderado.js?v=32"></script>
  <script defer src="/assets/switchRole.js?v=2000"></script>
<script defer src="/assets/apoderadoTesorero.js?v=2100"></script>
  <script defer src="/assets/apoderadoWelcome.js?v=2400"></script>
  <script defer src="/assets/core.js?v=2402"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Nueva contraseña · MiCursoX</title>
  <link rel="stylesheet" href="/assets/login-pro.css?v=73-micursox">
  <link rel="stylesheet" href="/assets/micursox-components.css?v=2">
  <link rel="icon" href="/assets/brand/micursox-isotype.svg" type="image/svg+xml">
  <style>
    body{min-height:100vh;background:#f8fafc;color:#0f172a}
    .resetShell{min-height:100vh;display:flex;flex-direction:column}
    .resetHeader{padding:28px 20px 18px;text-align:center;background:#fff;border-bottom:1px solid #ede9fe}
    .resetHeader img{width:min(260px,72vw);height:auto}
    .resetMain{flex:1;display:grid;place-items:center;padding:32px 18px}
    .resetCard{width:min(480px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:26px;box-shadow:0 18px 50px rgba(15,23,42,.08)}
    .resetCard h1{margin:0 0 8px;font-size:28px;line-height:1.12}
    .resetCard p{margin:0 0 22px;color:#64748b;line-height:1.5}
    .resetField{display:block;margin-top:14px}
    .resetField span{display:block;font-size:13px;font-weight:800;color:#475569;margin-bottom:6px}
    .resetField input{width:100%;box-sizing:border-box;border:1px solid #dbe3ef;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
    .resetField input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
    .resetBtn{width:100%;margin-top:18px;min-height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:850;font-size:15px;cursor:pointer}
    .resetBtn:disabled{opacity:.6;cursor:wait}
    .resetMessage{display:none;margin-top:14px;padding:11px 12px;border-radius:12px;font-size:13px;line-height:1.4}
    .resetMessage.isSuccess{display:block;background:#ecfdf5;color:#166534}
    .resetMessage.isError{display:block;background:#fef2f2;color:#b91c1c}
    .resetFooter{padding:22px 18px 28px;text-align:center;color:#94a3b8;font-size:12px;background:#fff;border-top:1px solid #f1f5f9}
    .resetFooter img{width:118px;height:auto;opacity:.8;margin-bottom:8px}
    .resetBack{display:inline-block;margin-top:14px;color:#6d28d9;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <div class="resetShell">
    <header class="resetHeader">
      <img src="/assets/brand/micursox-compact.svg" alt="MiCursoX">
    </header>

    <main class="resetMain">
      <section class="resetCard" aria-labelledby="resetTitle">
        <h1 id="resetTitle">Crea una nueva contraseña</h1>
        <p>Ingresa una nueva contraseña para tu cuenta MiCursoX.</p>

        <form id="resetPasswordForm" novalidate>
          <label class="resetField">
            <span>Nueva contraseña</span>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="resetField">
            <span>Repetir nueva contraseña</span>
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <button id="resetPasswordButton" class="resetBtn" type="submit">Actualizar contraseña</button>
          <div id="resetPasswordMessage" class="resetMessage" aria-live="polite"></div>
        </form>
        <a class="resetBack" href="/login.html">Volver al inicio de sesión</a>
      </section>
    </main>

    <footer class="resetFooter">
      <img src="/assets/brand/micursox-compact.svg" alt="MiCursoX"><br>
      Gestión simple y segura para tu curso.<br>
      Este es un proceso seguro de recuperación de contraseña.
    </footer>
  </div>

  <script defer src="/assets/supabase-config.js?v=1"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/assets/reset-password.js?v=1"></script>
</body>
</html>

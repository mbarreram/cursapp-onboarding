<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cursapp</title>
</head>
<body>
<script>
  function routeByRole(role){
    if (role === 'Tesorero') return 'dashboard-tesorero.html';
    if (role === 'Admin') return 'dashboard-admin.html';
    return 'dashboard-apoderado.html';
  }
  function needsOnboarding(u){
    if (!u) return true;
    if (!u.school || !u.course) return true;
    if (u.role === 'Apoderado' && !u.studentName) return true;
    if (!u.termsAccepted) return true;
    return false;
  }
  try{
    const u = JSON.parse(localStorage.getItem('cursapp_demo_user') || 'null');
    if (u && u.email){
      if (needsOnboarding(u)) window.location.replace('onboarding.html');
      else window.location.replace(routeByRole(u.role));
    } else {
      window.location.replace('login.html');
    }
  }catch(e){
    window.location.replace('login.html');
  }
</script>
</body>
</html>

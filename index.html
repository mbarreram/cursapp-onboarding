<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursapp · Ingreso</title>

  <link rel="stylesheet" href="assets/login-pro.css" />
</head>
<body>

<div class="auth-container">

  <!-- ===== CARDS DE ACCIÓN ===== -->

<section class="regMini">
  <div class="regMini__head">
    <h2 class="regMini__title">Registrar</h2>
  </div>

  <div class="regMini__grid">
    <!-- Directiva / Presidente -->
    <article class="regMiniCard regMiniCard--primary">
      <div class="regMiniCard__top">
        <div class="regMiniCard__icon">🎓</div>
        <div>
          <h3 class="regMiniCard__title">Presidente</h3>
          <p class="regMiniCard__sub">Registra tu curso</p>
        </div>
      </div>
      <button id="btnDirectiva" type="button" class="regMiniCard__btn regMiniCard__btn--yellow">
        Registrar
      </button>
    </article>

    <!-- Apoderado -->
    <article class="regMiniCard">
      <div class="regMiniCard__top">
        <div class="regMiniCard__icon">👨‍👩‍👧</div>
        <div>
          <h3 class="regMiniCard__title">Apoderado</h3>
          <p class="regMiniCard__sub">Regístrate</p>
        </div>
      </div>
      <button id="btnApoderado" type="button" class="regMiniCard__btn regMiniCard__btn--ghost">
        Registrar
      </button>
    </article>
  </div>
</section>
  <!-- ===== LOGIN EXISTENTE ===== -->
  <section class="login-card">
    <h1>Ingresa a tu curso</h1>
    <p>Presidentes, tesoreros y apoderados</>

    <!-- IMPORTANTE: IDs deben coincidir con login.js -->
    <form id="loginForm">
      <input
        id="username"
        type="email"
        placeholder="correo@ejemplo.com"
        autocomplete="username"
        required
      />

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      />

      <div id="loginError" class="error" style="display:none;"></div>

      <div class="actions">
        <button type="submit" class="btn primary">
  Ingresar
</button>
        <button type="button" class="btn-secondary" onclick="resetForm()">Cancelar</button>
      </div>
    </form>

    <div class="links">
      <a href="#">Olvidé mi contraseña</a>
      <a href="#">Recuperar contraseña</a>
    </div>
  </section>

</div>

<!-- TU LOGIN REAL -->

<!-- Helpers UX -->

<script src="/assets/login.js?v=20260213" defer></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const btnDirectiva = document.getElementById("btnDirectiva");
  const btnApoderado = document.getElementById("btnApoderado");

  const ONBOARDING_URL = "/onboarding/dashboard.html";

  if (btnDirectiva) {
    btnDirectiva.addEventListener("click", () => {
      window.location.href = `${ONBOARDING_URL}?mode=directiva&role=presidente`;
    });
  }

  if (btnApoderado) {
    btnApoderado.addEventListener("click", () => {
      window.location.href = `${ONBOARDING_URL}?mode=apoderado`;
    });
  }
});
</script>

  
  

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursapp · Ingreso</title>

  <link rel="stylesheet" href="assets/login-pro.css" />
</head>
<body>

<div class="auth-container">

  <!-- ===== CARDS DE ACCIÓN ===== -->
  <section class="regGroup">
  <div class="regGroup__head">
    <h2 class="regGroup__title">Registrar</h2>
    <p class="regGroup__sub">Elige tu rol para comenzar.</p>
  </div>

  <div class="regGrid">
    <!-- Directiva -->
    <article class="regCard regCard--directiva">
      <div class="regCard__icon">🎓</div>
      <div class="regCard__body">
        <h3 class="regCard__title">Directiva</h3>
        <p class="regCard__text">Crear curso y gestionar campañas, pagos y rendiciones.</p>
      </div>
      <button id="btnDirectiva" type="button" class="regCard__btn regCard__btn--primary">
        Registrar
      </button>
    </article>

    <!-- Apoderado -->
    <article class="regCard regCard--apoderado">
      <div class="regCard__icon">👨‍👩‍👧</div>
      <div class="regCard__body">
        <h3 class="regCard__title">Apoderado</h3>
        <p class="regCard__text">Unirme a un curso y pagar mis cuotas.</p>
      </div>
      <button id="btnApoderado" type="button" class="regCard__btn regCard__btn--ghost">
        Registrar
      </button>
    </article>
  </div>
</section>

  <!-- ===== LOGIN EXISTENTE ===== -->
  <section class="login-card">
    <h1>Ingresa a tu curso</h1>
    <p>Presidentes, tesoreros y apoderados</>

    <!-- IMPORTANTE: IDs deben coincidir con login.js -->
    <form id="loginForm">
      <input
        id="username"
        type="email"
        placeholder="correo@ejemplo.com"
        autocomplete="username"
        required
      />

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      />

      <div id="loginError" class="error" style="display:none;"></div>

      <div class="actions">
        <button type="submit" class="btn primary">
  Ingresar
</button>
        <button type="button" class="btn-secondary" onclick="resetForm()">Cancelar</button>
      </div>
    </form>

    <div class="links">
      <a href="#">Olvidé mi contraseña</a>
      <a href="#">Recuperar contraseña</a>
    </div>
  </section>

</div>

<!-- TU LOGIN REAL -->

<!-- Helpers UX -->

<script src="/assets/login.js" defer></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const btnDirectiva = document.getElementById("btnDirectiva");
  const btnApoderado = document.getElementById("btnApoderado");

  const ONBOARDING_URL = "/onboarding/dashboard.html";

  if (btnDirectiva) {
    btnDirectiva.addEventListener("click", () => {
      window.location.href = `${ONBOARDING_URL}?mode=directiva&role=presidente`;
    });
  }

  if (btnApoderado) {
    btnApoderado.addEventListener("click", () => {
      window.location.href = `${ONBOARDING_URL}?mode=apoderado`;
    });
  }
});
</script>

  
  

</body>
</html>

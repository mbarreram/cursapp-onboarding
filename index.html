<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursapp · Ingreso</title>

  <link rel="stylesheet" href="assets/login-pro.css" />
</head>
<body>

<div class="auth-container">

  <!-- ===== CARDS DE ACCIÓN ===== -->
  <section class="entry-cards">
    <div class="entry-card primary" onclick="goDirectiva()">
      <div class="icon">🎓</div>
      <h3>Soy directiva</h3>
      <p>Crear curso y gestionar campañas, pagos y rendiciones.</p>


<button id="btnDirectiva" type="button" class="btn primary">
  Registrar curso
</button>



      
    </div>

    <div class="entry-card secondary" onclick="goApoderado()">
      <div class="icon">👨‍👩‍👧</div>
      <h3>Soy apoderado</h3>
      <p>Unirme a un curso y pagar mis cuotas.</>

<button id="btnApoderado" type="button" class="btn secondary">
  Unirme al curso
</button>
      
    </div>
  </section>

  <!-- ===== LOGIN EXISTENTE ===== -->
  <section class="login-card">
    <h3>¿Ya estás registrado?</h3>

    <!-- IMPORTANTE: IDs deben coincidir con login.js -->
    <form id="loginForm">
      <input
        id="username"
        type="text"
        placeholder="Usuario"
        autocomplete="username"
        required
      />

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      />

      <div id="loginError" class="error" style="display:none;"></div>

      <div class="actions">
        <button type="submit" class="btn primary">
  Ingresar
</button>
        <button type="button" class="btn-secondary" onclick="resetForm()">Cancelar</button>
      </div>
    </form>

    <div class="links">
      <a href="#">Olvidé mi contraseña</a>
      <a href="#">Recuperar contraseña</a>
    </div>
  </section>

</div>

<!-- TU LOGIN REAL -->

<!-- Helpers UX -->

<script src="/assets/login.js" defer></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const btnDirectiva = document.getElementById("btnDirectiva");
  const btnApoderado = document.getElementById("btnApoderado");

  const ONBOARDING_URL = "/onboarding/dashboard.html";

  if (btnDirectiva) {
    btnDirectiva.addEventListener("click", () => {
      window.location.href = `${ONBOARDING_URL}?mode=directiva&role=presidente`;
    });
  }

  if (btnApoderado) {
    btnApoderado.addEventListener("click", () => {
      window.location.href = `${ONBOARDING_URL}?mode=apoderado`;
    });
  }
});
</script>

  
  

</body>
</html>

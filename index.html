<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursapp · Ingreso</title>

  <link rel="stylesheet" href="assets/login-pro.css" />
</head>
<body>

<div class="auth-container">

  <!-- ===== CARDS DE ACCIÓN ===== -->
  <section class="entry-cards">
    <div class="entry-card primary" onclick="goDirectiva()">
      <div class="icon">🎓</div>
      <h3>Soy directiva</h3>
      <p>Crear curso y gestionar campañas, pagos y rendiciones.</p>
<button id="btnDirectiva" class="btn primary">
  Registrar curso
</button>
    </div>

    <div class="entry-card secondary" onclick="goApoderado()">
      <div class="icon">👨‍👩‍👧</div>
      <h3>Soy apoderado</h3>
      <p>Unirme a un curso y pagar mis cuotas.</p>
      <button id="btnApoderado" class="btn secondary">
  Unirme al curso
</button>
    </div>
  </section>

  <!-- ===== LOGIN EXISTENTE ===== -->
  <section class="login-card">
    <h3>¿Ya estás registrado?</h3>

    <!-- IMPORTANTE: IDs deben coincidir con login.js -->
    <form id="loginForm">
      <input
        id="username"
        type="text"
        placeholder="Usuario"
        autocomplete="username"
        required
      />

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      />

      <div id="loginError" class="error" style="display:none;"></div>

      <div class="actions">
        <button id="btnLogin" class="btn primary">
  Ingresar
</button>
        <button type="button" class="btn-secondary" onclick="resetForm()">Cancelar</button>
      </div>
    </form>

    <div class="links">
      <a href="#">Olvidé mi contraseña</a>
      <a href="#">Recuperar contraseña</a>
    </div>
  </section>

</div>

<!-- TU LOGIN REAL -->
<script src="login.js"></script>

<!-- Helpers UX -->
<script>
  function goDirectiva() {
    // mismo flujo que hoy, pero guiado
    document.getElementById("btnDirectiva")?.addEventListener("click", () => {
  // Directiva por defecto entra como presidente
  window.location.href = "/onboarding.html?mode=directiva&role=presidente";
});
  }

  function goApoderado() {
    document.getElementById("btnApoderado")?.addEventListener("click", () => {
  window.location.href = "/onboarding.html?mode=apoderado";
});
  }

  function resetForm() {
    document.getElementById("btnLogin")?.addEventListener("click", () => {
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;

  if (!user || !pass) {
    alert("Completa usuario y contraseña");
    return;
  }

  // tu lógica actual
  // login.js ya maneja roles y redirección
});
  }
</script>
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const btnDirectiva = document.getElementById("btnDirectiva");
  const btnApoderado = document.getElementById("btnApoderado");

  // Cambia SOLO esta variable si decides usar /dashboard.html en vez de /onboarding/dashboard.html
  const ONBOARDING_URL = "/onboarding/dashboard.html";

  if (btnDirectiva) {
    btnDirectiva.addEventListener("click", () => {
      window.location.href = `${ONBOARDING_URL}?mode=directiva&role=presidente`;
    });
  }

  if (btnApoderado) {
    btnApoderado.addEventListener("click", () => {
      window.location.href = `${ONBOARDING_URL}?mode=apoderado`;
    });
  }
});
</script>

</body>
</html>

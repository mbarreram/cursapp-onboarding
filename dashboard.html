<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Cursapp</title>
  <link rel="stylesheet" href="assets/styles.css" />

  <style>
    /* cursapp polish */
    header{border-bottom:1px solid rgba(229,231,235,.9);}
    .topbar{padding:10px 16px !important;}
    .logo{width:32px;height:32px;border-radius:10px;}
    .tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid rgba(229,231,235,.9);padding:8px 10px;display:flex;justify-content:space-around;gap:8px;z-index:9998;}
    .tab{flex:1;min-width:0;padding:10px 8px;border-radius:14px;border:1px solid transparent;background:transparent;font-weight:900;display:flex;gap:8px;align-items:center;justify-content:center;}
    .tab.active{background:rgba(91,92,226,.10);border-color:rgba(91,92,226,.25);}
    .ico{font-size:18px;}
    body{padding-bottom:78px;}
    .card{border-radius:18px;}
    .tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px;background:rgba(100,116,139,.12);color:#0f172a;}
    .tag.ok{background:rgba(34,197,94,.12);color:#166534;}
    .tag.warn{background:rgba(245,158,11,.14);color:#92400e;}
    .tag.danger{background:rgba(239,68,68,.12);color:#991b1b;}
  </style>
</head>

<body>
  <header>
    <div class="topbar" style="position:relative;">
      <div class="brand">
        <div class="logo">C</div>
        <div id="whoLine"></div>
      </div>

      <!-- Menú (siempre visible) -->
      <button class="btn ghost" id="menuBtn" type="button" aria-expanded="false"
        style="position:absolute;right:16px;top:10px;z-index:10001;">☰</button>

      <div id="menuDropdown"
        style="display:none;position:absolute;right:16px;top:56px;background:#fff;border:1px solid rgba(229,231,235,.9);
        border-radius:14px;padding:8px;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:10002;">
        <button class="btn ghost" id="logoutMenuItem" type="button" style="width:100%;text-align:left;">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <div class="container" id="app"></div>

  <script src="assets/app.js?v=1053"></script>
</body>
</html>

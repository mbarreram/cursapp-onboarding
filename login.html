<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cursapp · Login</title>
  <link rel="stylesheet" href="assets/styles.css?v=100"/>
</head>
<body class="auth">

  <div class="auth-card">
    <div class="brandCenter">
      <div class="logo big">C</div>
      <h1>Cursapp</h1>
      <p class="muted">Acceso demo</p>
    </div>

    <form id="loginForm">
      <label>Usuario</label>
      <input id="username" placeholder="apoderado | tesorero | presidente" required>

      <label>Contraseña</label>
      <input id="password" type="password" placeholder="demo" required>

      <div id="loginError" class="error" style="display:none;"></div>

      <button class="btn primary" type="submit">Ingresar</button>
    </form>

    <p class="muted small">Demo: usa <b>apoderado</b>, <b>tesorero</b> o <b>presidente</b></p>
  </div>

  <script src="assets/login.js?v=100"></script>
</body>
</html>

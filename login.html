<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursapp · Ingreso</title>

  <link rel="stylesheet" href="assets/login-pro.css" />
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/cursapp-icon-192.png">
  <link rel="stylesheet" href="/assets/cursapp-platform.css?v=55">
</head>
<body>

<div class="auth-container">

  <!-- ===== CARDS DE ACCIÓN ===== -->
  <section class="entry-cards">
    <div class="entry-card primary" onclick="goDirectiva()">
      <div class="icon">🎓</div>
      <h3>Soy directiva</h3>
      <p>Crear curso y gestionar campañas, pagos y rendiciones.</p>
      <button>Registrar curso</button>
    </div>

    <div class="entry-card secondary" onclick="goApoderado()">
      <div class="icon">👨‍👩‍👧</div>
      <h3>Soy apoderado</h3>
      <p>Unirme a un curso y pagar mis cuotas.</p>
      <button>Unirme al curso</button>
    </div>
  </section>

  <!-- ===== LOGIN EXISTENTE ===== -->
  <section class="login-card">
    <h3>¿Ya estás registrado?</h3>

    <!-- IMPORTANTE: IDs deben coincidir con login.js -->
    <form id="loginForm">
      <input
        id="username"
        type="text"
        placeholder="Usuario"
        autocomplete="username"
        required
      />

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      />

      <div id="loginError" class="error" style="display:none;"></div>

      <div class="actions">
        <button type="submit" class="btn-primary">Ingresar</button>
        <button type="button" class="btn-secondary" onclick="resetForm()">Cancelar</button>
      </div>
    </form>

    <div class="links">
      <a href="#">Olvidé mi contraseña</a>
      <a href="#">Recuperar contraseña</a>
    </div>
  </section>

</div>

<!-- TU LOGIN REAL -->
<script src="assets/login.js?v=423"></script>

<!-- Helpers UX -->
<script>
  function goDirectiva() {
    // mismo flujo que hoy, pero guiado
    document.getElementById("username").value = "presidente";
    document.getElementById("password").value = "";
    document.getElementById("username").focus();
  }

  function goApoderado() {
    document.getElementById("username").value = "apoderado";
    document.getElementById("password").value = "";
    document.getElementById("username").focus();
  }

  function resetForm() {
    document.getElementById("loginForm").reset();
    const err = document.getElementById("loginError");
    if (err) err.style.display = "none";
  }
</script>

  <script defer src="/assets/cursapp-platform.js?v=55"></script>
</body>
</html>

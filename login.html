<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Cursapp</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    /* Login page small additions */
    .loginWrap{ max-width:520px; margin:0 auto; padding:24px 16px 120px; }
    .loginCard{ background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:18px; }
    .logoBig{ width:56px; height:56px; border-radius:16px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:950; font-size:22px; }
    .fieldLabel{ font-size:12px; color:var(--muted); font-weight:800; margin-top:12px; }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo">C</div>
        <div style="min-width:0;">
          <div class="brandTitle">Cursapp</div>
          <div class="who">Acceso demo</div>
        </div>
      </div>
    </div>
  </header>

  <div class="loginWrap">
    <div class="loginCard">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="logoBig">C</div>
        <div>
          <div style="font-weight:950; font-size:18px;">Iniciar sesión</div>
          <div class="muted">Demo local (localStorage)</div>
        </div>
      </div>

      <div class="fieldLabel">Nombre</div>
      <input id="name" placeholder="Ej: Mauricio" />

      <div class="fieldLabel">Correo</div>
      <input id="email" placeholder="demo@cursapp.cl" inputmode="email" />

      <div class="fieldLabel">Curso</div>
      <input id="course" placeholder="2° Básico A" />

      <div class="fieldLabel">Colegio</div>
      <input id="school" placeholder="Colegio Demo" />

      <div class="actions" style="margin-top:14px;">
        <button class="action primary" onclick="login()">Entrar</button>
        <button class="action" onclick="fillDemo()">Autocompletar</button>
      </div>

      <div class="note">Al entrar se guardará una sesión demo en <code>localStorage</code>.</div>
    </div>
  </div>

<script>
  function fillDemo(){
    document.getElementById('name').value = 'Mauricio (Demo)';
    document.getElementById('email').value = 'demo@cursapp.cl';
    document.getElementById('course').value = '2° Básico A';
    document.getElementById('school').value = 'Colegio Demo';
  }

  function login(){
    const user = {
      name: (document.getElementById('name').value || '').trim() || 'Mauricio (Demo)',
      email: (document.getElementById('email').value || '').trim() || 'demo@cursapp.cl',
      course: (document.getElementById('course').value || '').trim() || '2° Básico A',
      school: (document.getElementById('school').value || '').trim() || 'Colegio Demo'
    };
    localStorage.setItem('cursapp_demo_user', JSON.stringify(user));
    window.location.href = "dashboard.html";
  }

  // Si ya hay sesión, ir directo
  try{
    const u = JSON.parse(localStorage.getItem('cursapp_demo_user') || 'null');
    if (u && u.email) window.location.href = "dashboard.html";
  }catch(e){}
</script>
</body>
</html>

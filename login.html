<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Cursapp</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont; background:#f5f7fb; }
    .card {
      max-width:420px; margin:80px auto; background:#fff;
      padding:24px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.08)
    }
    h2 { margin-top:0 }
    input {
      width:100%; padding:12px; margin-top:12px;
      border-radius:8px; border:1px solid #d1d5db; font-size:15px
    }
    button {
      width:100%; padding:14px; margin-top:12px;
      border:none; border-radius:8px; font-size:16px; cursor:pointer
    }
    .primary { background:#4f46e5; color:#fff }
    .secondary { background:#e5e7eb }
  </style>
</head>
<body>

<div class="card">
  <h2>Bienvenido a Cursapp</h2>

  <input placeholder="Correo (ficticio)" />
  <input placeholder="Contraseña (ficticia)" type="password" />

  <button class="primary" onclick="goRegister()">Iniciar sesión</button>
  <button class="secondary" onclick="goRegister()">Registrar apoderado</button>
</div>

<script>
  function goRegister() {
    window.location.href = "register.html";
  }
</script>

</body>
</html>

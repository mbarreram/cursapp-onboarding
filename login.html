<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursapp · Ingreso</title>
<link rel="stylesheet" href="assets/login-pro.css">
</head>
<body>
<div class="container">

  <div class="cards">
    <div class="card primary">
      <h3>Soy directiva</h3>
      <p>Registrar curso y comenzar la gestión.</p>
      <button>Registrar curso</button>
    </div>

    <div class="card secondary">
      <h3>Soy apoderado</h3>
      <p>Unirme al curso y ver mis cuotas.</p>
      <button>Unirme al curso</button>
    </div>
  </div>

  <div class="login">
    <h3>¿Ya estás registrado?</h3>
    <input placeholder="Usuario">
    <input type="password" placeholder="Contraseña">

    <div class="actions">
      <button class="ingresar">Ingresar</button>
      <button class="cancelar">Cancelar</button>
    </div>

    <div class="links">
      <a href="#">Olvidé mi contraseña</a>
      <a href="#">Recuperar contraseña</a>
    </div>
  </div>

</div>
</body>
</html>

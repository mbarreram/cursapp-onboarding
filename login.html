<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cursapp · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/landing-human.css?v=611">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/cursapp-icon-192.png">
</head>
<body class="authPage">
  <main class="authPanel" aria-label="Iniciar sesión Cursapp">
    <a class="lp-back" href="/landing.html">← Volver</a>
    <div class="authIconBig">🔐</div>
    <h1>Iniciar sesión</h1>
    <p class="sub">Bienvenido nuevamente a Cursapp</p>

    <form id="loginForm" class="loginForm">
      <input id="username" class="lp-input" type="email" placeholder="Correo electrónico" autocomplete="username" required />
      <div style="position:relative">
        <input id="password" class="lp-input" type="password" placeholder="Contraseña" autocomplete="current-password" required style="padding-right:54px" />
        <button id="togglePassword" type="button" aria-label="Mostrar contraseña" style="position:absolute;right:8px;top:7px;border:0;background:#f8fafc;border-radius:12px;width:40px;height:40px">👁</button>
      </div>
      <div id="loginError" class="error" style="display:none;"></div>
      <a href="#" style="color:#0f8f4d;font-weight:900;text-align:center;margin:4px 0 6px">¿Olvidaste tu contraseña?</a>
      <button class="lp-btn dark" type="submit">Ingresar</button>
      <div style="display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:13px;font-weight:850;margin:8px 0"><span style="height:1px;background:#e5ece8;flex:1"></span>o continúa con<span style="height:1px;background:#e5ece8;flex:1"></span></div>
      <button id="googleLoginBtn" type="button" class="lp-social"><span style="color:#4285f4;font-weight:950">G</span> Google</button>
      <button type="button" class="lp-social" disabled style="opacity:.72"> Apple</button>
    </form>

    <div class="lp-bottomBox">
      <p style="margin:0 0 12px;color:#64748b;font-weight:850">¿Nuevo en Cursapp?</p>
      <div style="display:grid;gap:10px">
        <a href="/onboarding/dashboard.html?mode=apoderado" class="lp-btn ghost">Registrarme como apoderado</a>
        <a href="/onboarding/dashboard.html?mode=directiva&role=presidente" class="lp-btn ghost">Crear mi curso (presidente)</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabaseClient.js?v=20260608" defer></script>
  <script src="/assets/login.js?v=20260623-supabase-auth" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const p=document.getElementById('password');
      document.getElementById('togglePassword')?.addEventListener('click',()=>{ p.type = p.type === 'password' ? 'text' : 'password'; });
      document.getElementById('googleLoginBtn')?.addEventListener('click',()=>{
        const err=document.getElementById('loginError');
        if(err){err.style.display='block';err.textContent='Google Login queda visualmente preparado; falta conectar proveedor OAuth.';}
      });
    });
  </script>
</body>
</html>

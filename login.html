<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cursapp - Login</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div class="topbar">
    <div class="user-chip">
      <div class="avatar">C</div>
      <div class="user-meta">
        <div class="name">Cursapp</div>
        <div class="role">Demo</div>
      </div>
    </div>
  </div>

  <main>
    <div class="card" style="max-width:520px;margin:24px auto;">
      <h1 style="margin:0 0 10px;">Iniciar sesión</h1>
      <p class="hint" style="margin:0 0 14px;">
        Usa <b>apoderado</b>, <b>tesorero</b> o <b>admin</b> como usuario. La contraseña puede ser cualquiera.
      </p>

      <form id="loginForm" class="form" autocomplete="on">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" placeholder="apoderado / tesorero / admin" required/>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required/>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Entrar</button>
        </div>
      </form>

      <p id="loginError" class="hint" style="margin:12px 0 0; color: var(--danger); display:none;"></p>
    </div>
  </main>

  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>

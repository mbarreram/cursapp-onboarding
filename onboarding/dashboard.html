<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cursapp · Onboarding</title>
  <link rel="stylesheet" href="../assets/styles.css?v=400">
</head>
<body>
  <header>
    <div class="topbar" style="position:relative;">
      <div class="brand">
        <div class="logo">C</div>
        <div id="whoLine"></div>
      </div>
      <button class="btn ghost" id="menuBtn" type="button" aria-expanded="false"
        style="position:absolute;right:16px;top:10px;z-index:10001;">☰</button>
      <div id="menuDropdown"
        style="display:none;position:absolute;right:16px;top:56px;background:#fff;border:1px solid rgba(229,231,235,.9);
        border-radius:14px;padding:8px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:10002;">
        <button class="btn ghost" id="backLogin" type="button" style="width:100%;text-align:left;">Volver al login</button>
      </div>
    </div>
  </header>

  <div class="container" id="app"></div>

  <script>
    window.FORCE_ONBOARDING_PAGE = true;

    (function(){
      const btn=document.getElementById('menuBtn');
      const dd=document.getElementById('menuDropdown');
      const back=document.getElementById('backLogin');
      if(btn && dd){
        btn.onclick=(e)=>{e.stopPropagation(); dd.style.display = (dd.style.display==='block'?'none':'block');};
        document.addEventListener('click',()=>{dd.style.display='none';});
      }
      if(back){ back.onclick=()=>{ window.location.href = '../login.html'; }; }
    })();

    window.addEventListener('load', ()=>{
      setTimeout(()=>{
        const root=document.getElementById('app');
        if(root && root.innerHTML.trim().length<10){
          root.innerHTML = `
            <div class="card" style="margin-top:12px;border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.08);">
              <div style="font-weight:950;">Onboarding no cargó</div>
              <div class="muted" style="margin-top:6px;">No se ejecutó el JS del onboarding. Verifica que exista el archivo:</div>
              <div class="muted" style="margin-top:6px;font-size:12px;"><b>/onboarding/assets/app.js</b></div>
              <div class="muted" style="margin-top:6px;">Luego recarga con:</div>
              <div class="muted" style="margin-top:6px;font-size:12px;"><b>/onboarding/dashboard.html?v=70</b></div>
            </div>
          `;
        }
      }, 900);
    });
  </script>

  <script src="assets/app.js?v=1083"></script>
</body>
</html>

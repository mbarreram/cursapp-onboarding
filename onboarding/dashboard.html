<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cursapp · Onboarding</title>

  <link rel="stylesheet" href="/onboarding/assets/styles.css?v=1500">

  <style>
    .debugCard{border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.08);border-radius:16px;padding:12px;margin-top:12px}
  </style>
</head>

<body>
  <header>
    <div class="topbar" style="position:relative;">
      <div class="brand">
        <div class="logo">C</div>
        <div id="whoLine"></div>
      </div>

      <button class="btn ghost" id="menuBtn"
        style="position:absolute;right:16px;top:10px;">☰</button>

      <div id="menuDropdown"
        style="display:none;position:absolute;right:16px;top:56px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:8px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.12);">
        <button class="btn ghost" id="backLogin" style="width:100%;text-align:left;">Volver al login</button>
        <button class="btn ghost" id="resetMenuItem" style="width:100%;text-align:left;">Reset demo</button>
        <button class="btn ghost" id="debugOn" style="width:100%;text-align:left;">Activar debug</button>
      </div>
    </div>
  </header>

  <!-- Cabecera modo -->
  <div class="container" style="margin-top:12px;">
    <div class="card" style="padding:12px;">
      <div style="font-weight:950" id="onbModeTitle">Onboarding</div>
      <div class="muted" style="margin-top:4px;" id="onbModeSub"></div>
    </div>
  </div>

  <!-- Hero productivo (solo directiva) -->
  <div class="container" id="onbHero" style="margin-top:12px;display:none;">
    <div class="card" style="padding:16px;">
      <div style="font-size:20px;font-weight:950;line-height:1.15;">Crea tu curso en 2 minutos</div>
      <div class="muted" style="margin-top:8px;">Al finalizar, Cursapp genera <b>código para apoderados</b> y <b>código para tesorero</b>.</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;">
        <span class="pill" style="padding:8px 10px;border:1px solid #e5e7eb;border-radius:999px;background:#f8fafc;font-weight:700;">✅ Cobros y pagos</span>
        <span class="pill" style="padding:8px 10px;border:1px solid #e5e7eb;border-radius:999px;background:#f8fafc;font-weight:700;">🧾 Rendiciones</span>
        <span class="pill" style="padding:8px 10px;border:1px solid #e5e7eb;border-radius:999px;background:#f8fafc;font-weight:700;">🔒 Transparencia</span>
      </div>
    </div>
  </div>

  <div class="container" id="app"></div>

  <script>
    (function(){
      const btn=document.getElementById('menuBtn');
      const dd=document.getElementById('menuDropdown');
      const dbg=document.getElementById('debugOn');

      btn.onclick=(e)=>{
        e.stopPropagation();
        dd.style.display = (dd.style.display==='block') ? 'none' : 'block';
      };
      document.addEventListener('click',()=> dd.style.display='none');

      dbg.onclick=()=>{
        localStorage.setItem('cursapp_onb_debug','1');
        alert('Debug activado');
      };
    })();

    (function(){
      const qs = new URLSearchParams(location.search);
      const mode = qs.get("mode") || "apoderado";
      const role = (qs.get("role") || "presidente").toLowerCase();
      const t = document.getElementById("onbModeTitle");
      const s = document.getElementById("onbModeSub");
      const hero = document.getElementById('onbHero');

      if(mode === "directiva"){
        hero.style.display = 'block';
        t.textContent = "Onboarding · Directiva";
        s.textContent = (role === "tesorero")
          ? "Crear curso como Tesorero."
          : "Crear curso como Presidente.";
      } else {
        hero.style.display = 'none';
        t.textContent = "Onboarding · Apoderado";
        s.textContent = "Unirte al curso y registrar al alumno/a.";
      }
    })();

    window.onerror=function(msg,src,line){
      document.getElementById('app').innerHTML=
        `<div class="card"><b>Error JS:</b><div class="debugCard">${msg}<br>${src}:${line}</div></div>`;
    };
  </script>

  <!-- core conecta backLogin + reset -->
  <script defer src="/assets/core.js?v=1500"></script>
<script defer src="/assets/enrollments.js?v=1600"></script>
<script defer src="/onboarding/assets/onboarding.js?v=1605"></script>
</body>
</html>

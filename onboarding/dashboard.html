<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cursapp · Onboarding</title>

  <link rel="stylesheet" href="/onboarding/assets/styles.css?v=1500">

  <style>
    .debugCard{border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.08);border-radius:16px;padding:12px;margin-top:12px}
  
  /* --- Premium onboarding skin (mobile-first) --- */
  :root{
    --bg:#f5f8ff;
    --card:#ffffff;
    --text:#0b1220;
    --muted:#5b6475;
    --line:rgba(15,23,42,.10);
    --shadow:0 18px 40px rgba(15,23,42,.10);
    --radius:22px;
    --primary:#2563eb;
    --primary2:#7c3aed;
    --accent:#facc15;
  }
  body{background:radial-gradient(1200px 700px at 15% 0%, rgba(37,99,235,.14), transparent 55%),
               radial-gradient(900px 600px at 85% 10%, rgba(124,58,237,.14), transparent 55%),
               var(--bg) !important;}
  .topbar{background:rgba(255,255,255,.82) !important; backdrop-filter:saturate(140%) blur(10px); border-bottom:1px solid var(--line);}
  .brand .logo{border-radius:18px !important; box-shadow:0 10px 24px rgba(17,24,39,.14)}
  .container{max-width:1040px}
  .onbPremium{padding:14px 0 90px}
  .onbHero{
    display:flex; align-items:flex-end; justify-content:space-between; gap:18px;
    padding:14px 4px 8px;
  }
  .onbBadge{
    display:inline-flex; align-items:center; gap:10px;
    padding:8px 12px; border-radius:999px;
    border:1px solid var(--line); background:rgba(255,255,255,.72);
    color:var(--muted); font-weight:700; font-size:13px;
  }
  .onbHero h1{margin:10px 0 8px; font-size:clamp(28px, 5vw, 40px); letter-spacing:-0.03em}
  .onbLead{margin:0; color:var(--muted); font-size:16px; line-height:1.55}
  .onbCard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .onbMain{padding:16px}
  .onbSectionTitle{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px}
  .onbSectionTitle h2{margin:0; font-size:18px; letter-spacing:-0.02em}
  .onbHint{color:var(--muted); font-size:13px; margin:0}
  .onbGrid{display:grid; gap:12px}
  .onbGrid.two{grid-template-columns:1fr}
  @media(min-width:760px){ .onbGrid.two{grid-template-columns:1fr 1fr} }
  .field label{font-weight:800 !important; color:var(--text)}
  .field input,.field select,.field textarea{
    border-radius:16px !important; border:1px solid rgba(15,23,42,.12) !important;
    padding:14px 14px !important; background:rgba(255,255,255,.96) !important;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none; box-shadow:0 0 0 4px rgba(37,99,235,.18) !important; border-color:rgba(37,99,235,.35) !important;
  }
  .chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px}
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--line); background:rgba(2,6,23,.04);
    padding:8px 10px; border-radius:999px; font-weight:700; color:var(--muted); font-size:13px;
  }
  .chip b{color:var(--text)}
  .stepper{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end}
  .stepDot{
    width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background:rgba(255,255,255,.75); color:var(--muted); font-weight:900;
  }
  .stepDot.active{background:linear-gradient(135deg, var(--primary), var(--primary2)); color:white; border-color:transparent; box-shadow:0 12px 26px rgba(37,99,235,.28)}
  .stepDot.done{background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.28); color:#15803d}
  .stepLine{width:38px; height:2px; background:rgba(15,23,42,.12); border-radius:999px}
  @media(max-width:520px){ .stepLine{display:none} .stepper{justify-content:flex-start} }
  .onbBottomBar{
    position:fixed; left:0; right:0; bottom:0;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.78); backdrop-filter:saturate(140%) blur(12px);
    border-top:1px solid var(--line); z-index:40;
  }
  .onbBottomInner{max-width:1040px; margin:0 auto; display:flex; gap:10px; align-items:center}
  .btn{border-radius:16px !important; padding:12px 14px !important; font-weight:900 !important}
  .btn.primary{
    background:linear-gradient(135deg, var(--primary), var(--primary2)) !important;
    border:none !important; box-shadow:0 16px 34px rgba(37,99,235,.25)
  }
  .btn.ghost{background:rgba(2,6,23,.04) !important; border:1px solid var(--line) !important; color:var(--text) !important}
  .btn.warn{background:linear-gradient(135deg, #fbbf24, #f97316) !important; border:none !important}
  .right{margin-left:auto}
  .softNote{
    border-radius:18px; border:1px dashed rgba(37,99,235,.25);
    background:rgba(37,99,235,.06); padding:12px 12px; color:var(--muted); font-size:13px; line-height:1.45;
    margin:12px 0 0;
  }

  </style>
</head>

<body>
  <header>
    <div class="topbar" style="position:relative;">
      <div class="brand">
        <div class="logo">C</div>
        <div id="whoLine"></div>
      </div>

      <button class="btn ghost" id="menuBtn"
        style="position:absolute;right:16px;top:10px;">☰</button>

      <div id="menuDropdown"
        style="display:none;position:absolute;right:16px;top:56px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:8px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.12);">
        <button class="btn ghost" id="backLogin" style="width:100%;text-align:left;">Volver al login</button>
        <button class="btn ghost" id="resetMenuItem" style="width:100%;text-align:left;">Reset demo</button>
        <button class="btn ghost" id="debugOn" style="width:100%;text-align:left;">Activar debug</button>
      </div>
    </div>
  </header>

  <!-- Cabecera modo -->
  <div class="container" style="margin-top:12px;">
    <div class="card" style="padding:12px;">
      <div style="font-weight:950" id="onbModeTitle">Onboarding</div>
      <div class="muted" style="margin-top:4px;" id="onbModeSub"></div>
    </div>
  </div>

  <div class="container" id="app"></div>

  <script>
    (function(){
      const btn=document.getElementById('menuBtn');
      const dd=document.getElementById('menuDropdown');
      const dbg=document.getElementById('debugOn');

      btn.onclick=(e)=>{
        e.stopPropagation();
        dd.style.display = (dd.style.display==='block') ? 'none' : 'block';
      };
      document.addEventListener('click',()=> dd.style.display='none');

      dbg.onclick=()=>{
        localStorage.setItem('cursapp_onb_debug','1');
        alert('Debug activado');
      };
    })();

    (function(){
      const qs = new URLSearchParams(location.search);
      const mode = qs.get("mode") || "apoderado";
      const role = (qs.get("role") || "presidente").toLowerCase();
      const t = document.getElementById("onbModeTitle");
      const s = document.getElementById("onbModeSub");

      if(mode === "directiva"){
        t.textContent = "Onboarding · Directiva";
        s.textContent = (role === "tesorero")
          ? "Crear curso como Tesorero."
          : "Crear curso como Presidente.";
      } else {
        t.textContent = "Onboarding · Apoderado";
        s.textContent = "Unirte al curso y registrar al alumno/a.";
      }
    })();

    window.onerror=function(msg,src,line){
      document.getElementById('app').innerHTML=
        `<div class="card"><b>Error JS:</b><div class="debugCard">${msg}<br>${src}:${line}</div></div>`;
    };
  </script>

  <!-- core conecta backLogin + reset -->
  <script defer src="/assets/config.js?v=2"></script>
  <script defer src="/assets/core.js?v=1501"></script>
<script defer src="/assets/enrollments.js?v=1600"></script>
<script defer src="/onboarding/assets/onboarding.js?v=1500"></script>
</body>
</html>

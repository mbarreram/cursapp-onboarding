<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cursapp - Onboarding</title>

  <link rel="stylesheet" href="/onboarding/assets/styles.css?v=1803-course-guard">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/cursapp-icon-192.png">
  <link rel="stylesheet" href="/assets/cursapp-platform.css?v=553">
</head>

<body class="onboardingPremium onbMockupV1">
  <header class="onbAppHeader">
    <div class="topbar">
      <button class="onbHeaderIcon" id="backLogin" type="button" aria-label="Volver al inicio">&#8249;</button>

      <a class="brand onbBrand" href="/index.html" aria-label="Cursapp">
        <span class="logo" aria-hidden="true">C</span>
        <strong>Cursapp</strong>
      </a>

      <button class="onbHeaderIcon" id="menuBtn" type="button" aria-label="Abrir menu">&#9776;</button>

      <div id="menuDropdown" class="onbMenuDropdown">
        <button class="btn ghost" id="menuBackLanding" type="button">Volver al landing</button>
      </div>
    </div>
  </header>

  <div class="container onbModeWrap" hidden>
    <div class="card">
      <div id="onbModeTitle">Onboarding</div>
      <div class="muted" id="onbModeSub"></div>
    </div>
  </div>

  <main class="container" id="app"></main>

  <script>
    (function(){
      const menuBtn = document.getElementById("menuBtn");
      const menu = document.getElementById("menuDropdown");
      const menuBack = document.getElementById("menuBackLanding");

      menuBtn.addEventListener("click", function(event){
        event.stopPropagation();
        menu.classList.toggle("isOpen");
      });

      menu.addEventListener("click", function(event){
        event.stopPropagation();
      });

      menuBack.addEventListener("click", function(){
        window.location.href = "/index.html";
      });

      document.addEventListener("click", function(){
        menu.classList.remove("isOpen");
      });
    })();

    window.onerror = function(msg, src, line){
      document.getElementById("app").innerHTML =
        '<div class="card"><b>Error JS:</b><div class="debugCard">' +
        String(msg) + '<br>' + String(src) + ':' + String(line) +
        '</div></div>';
    };
  </script>

  <script defer src="/assets/supabase-config.js?v=1"></script>
  <script defer src="/assets/config.js?v=2"></script>
  <script defer src="/assets/core.js?v=2601"></script>
  <script defer src="/assets/enrollments.js?v=1600"></script>
  <script defer src="/onboarding/assets/onboarding.js?v=2703-course-guard"></script>
  <script defer src="/assets/cursapp-platform.js?v=553"></script>
</body>
</html>

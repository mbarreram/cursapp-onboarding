name: Admin business storage guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-admin-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-admin-business-storage.mjs

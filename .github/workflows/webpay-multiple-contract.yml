name: Webpay multiple contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261026_webpay_group_staging.sql'
      - 'supabase/functions/webpay-*/index.ts'
      - 'tests/webpay-multiple-contract.test.mjs'
      - 'package.json'
      - '.github/workflows/webpay-multiple-contract.yml'
  workflow_dispatch:
jobs:
  static-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run financial contract checks
        run: npm run test:webpay-contract
      - name: Parse PostgreSQL migration syntax
        run: |
          python -m pip install --quiet 'pglast>=7,<8'
          python -c "from pglast import parse_sql; from pathlib import Path; parse_sql(Path('supabase/migrations/20261026_webpay_group_staging.sql').read_text()); print('PostgreSQL SQL parser OK')"

  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: webpay_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic database
        run: psql -v ON_ERROR_STOP=1 -f tests/webpay-isolated-fixture.sql
      - name: Apply staged financial migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026_webpay_group_staging.sql
      - name: Exercise grouped reserve settle refund
        run: psql -v ON_ERROR_STOP=1 -f tests/webpay-isolated-flow.sql

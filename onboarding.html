<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Onboarding | Cursapp</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .wrap{ max-width:720px; margin:0 auto; padding:24px 16px 140px; }
    .card2{ background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:18px; }
    .step{ display:flex; align-items:center; gap:10px; }
    .badge{ width:28px; height:28px; border-radius:999px; background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; font-weight:950; display:flex; align-items:center; justify-content:center; }
    .fieldLabel{ font-size:12px; color:var(--muted); font-weight:900; margin-top:12px; }
    .checkRow{ display:flex; gap:10px; align-items:flex-start; margin-top:12px; }
    .checkRow input{ width:auto; margin-top:3px; }
    .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width: 700px){ .two{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo">C</div>
        <div style="min-width:0;">
          <div class="brandTitle">Cursapp</div>
          <div class="who" id="who">Onboarding</div>
        </div>
      </div>
      <button class="btn" onclick="logout()">Cancelar</button>
    </div>
  </header>

  <div class="wrap">
    <div class="card2">
      <div class="step">
        <div class="badge">1</div>
        <div>
          <div style="font-weight:950; font-size:18px;">Completa tu onboarding</div>
          <div class="muted">Esto se hace una sola vez (demo).</div>
        </div>
      </div>

      <div class="hr"></div>

      <div class="two">
        <div>
          <div class="fieldLabel">Rol</div>
          <input id="role" disabled />
        </div>
        <div>
          <div class="fieldLabel">Correo</div>
          <input id="email" disabled />
        </div>
      </div>

      <div class="two">
        <div>
          <div class="fieldLabel">Colegio</div>
          <input id="school" placeholder="Ej: Colegio Menke" />
        </div>
        <div>
          <div class="fieldLabel">Curso</div>
          <input id="course" placeholder="Ej: 1° básico A" />
        </div>
      </div>

      <!-- Bloque condicional solo para Apoderado -->
      <div id="studentBlock" style="display:none;">
        <div class="fieldLabel">Nombre del alumno/a</div>
        <input id="studentName" placeholder="Ej: Benjamín Pérez" />
        <div class="note">Por privacidad, el apoderado escribe el nombre del alumno.</div>
      </div>

      <div class="hr"></div>

      <div class="checkRow">
        <input type="checkbox" id="terms" />
        <div>
          <div style="font-weight:900;">Acepto términos y condiciones</div>
          <div class="muted">Uso demo: esta aceptación se guarda localmente.</div>
        </div>
      </div>

      <div id="msg" style="margin-top:10px;"></div>

      <div class="actions" style="margin-top:14px;">
        <button class="action" onclick="goBack()">Volver</button>
        <button class="action primary" onclick="finish()">Finalizar</button>
      </div>
    </div>
  </div>

<script>
  function routeByRole(role){
    if (role === 'Tesorero') return 'dashboard-tesorero.html';
    if (role === 'Admin') return 'dashboard-admin.html';
    return 'dashboard-apoderado.html';
  }

  function logout(){
    localStorage.removeItem('cursapp_demo_user');
    window.location.href = "login.html";
  }

  function goBack(){
    window.location.href = "login.html";
  }

  function load(){
    let user = null;
    try{ user = JSON.parse(localStorage.getItem('cursapp_demo_user') || 'null'); }catch(e){}
    if (!user || !user.email){ window.location.href="login.html"; return; }

    document.getElementById('role').value = user.role || 'Apoderado';
    document.getElementById('email').value = user.email || '';
    document.getElementById('who').innerText = (user.name||'') + " · " + (user.role||'') + " · " + (user.email||'');

    const isApoderado = (user.role || 'Apoderado') === 'Apoderado';
    document.getElementById('studentBlock').style.display = isApoderado ? 'block' : 'none';

    // Prefill
    document.getElementById('school').value = user.school || '';
    document.getElementById('course').value = user.course || '';
    const sn = document.getElementById('studentName');
    if (sn) sn.value = user.studentName || '';
    document.getElementById('terms').checked = !!user.termsAccepted;
  }

  function finish(){
    let user = null;
    try{ user = JSON.parse(localStorage.getItem('cursapp_demo_user') || 'null'); }catch(e){}
    if (!user || !user.email){ window.location.href="login.html"; return; }

    const school = (document.getElementById('school').value || '').trim();
    const course = (document.getElementById('course').value || '').trim();
    const terms = document.getElementById('terms').checked;
    const snEl = document.getElementById('studentName');
    const studentName = snEl ? (snEl.value || '').trim() : '';
    const isApoderado = (user.role || 'Apoderado') === 'Apoderado';

    const msg = document.getElementById('msg');
    msg.innerHTML = '';

    if (!school || !course){
      msg.innerHTML = '<div class="error">Completa colegio y curso.</div>';
      return;
    }
    if (isApoderado && !studentName){
      msg.innerHTML = '<div class="error">Ingresa el nombre del alumno/a.</div>';
      return;
    }
    if (!terms){
      msg.innerHTML = '<div class="error">Debes aceptar los términos.</div>';
      return;
    }

    user.school = school;
    user.course = course;
    if (isApoderado) user.studentName = studentName;
    user.termsAccepted = true;

    localStorage.setItem('cursapp_demo_user', JSON.stringify(user));
    window.location.href = routeByRole(user.role);
  }

  load();
</script>
</body>
</html>

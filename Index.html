<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding Apoderado - Cursapp (Safari Fix)</title>
  <style>
    :root{
      --bg:#F5F7FA; --card:#FFFFFF; --text:#111827; --muted:#6B7280;
      --border:#D1D5DB; --primary:#4F46E5; --primaryHover:#4338CA; --danger:#DC2626;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family: Arial, sans-serif; background:var(--bg); color:var(--text); padding:20px; }
    .wrap{ max-width:420px; margin:0 auto; }
    .brand{ display:flex; align-items:center; gap:10px; margin:6px 0 14px; }
    .logo{ width:34px; height:34px; border-radius:10px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
    .card{ background:var(--card); border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.10); padding:22px; }
    h1{ font-size:20px; margin:0 0 6px; text-align:center; }
    .subtitle{ margin:0 0 16px; text-align:center; color:var(--muted); font-size:13px; }
    .progressRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:10px 0 18px; font-size:12px; color:var(--muted); }
    .bar{ flex:1; height:8px; background:#E5E7EB; border-radius:999px; overflow:hidden; }
    .bar > div{ height:100%; width:0%; background:var(--primary); border-radius:999px; transition:width .25s ease; }
    label{ display:block; margin-top:14px; font-weight:700; font-size:13px; }
    input, select{ width:100%; padding:11px 12px; margin-top:6px; border-radius:8px; border:1px solid var(--border); font-size:14px; background:#fff; }
    .hint{ margin-top:6px; font-size:12px; color:var(--muted); line-height:1.35; }
    .error{ margin-top:8px; padding:10px 12px; border-radius:10px; background:rgba(220,38,38,.08); border:1px solid rgba(220,38,38,.25); color:var(--danger); font-size:13px; display:none; }
    .checkboxRow{ display:flex; align-items:flex-start; gap:10px; margin-top:16px; }
    .checkboxRow input{ width:auto; margin-top:2px; transform:scale(1.05); }
    .checkboxRow label{ margin:0; font-weight:600; font-size:13px; line-height:1.25; }
    .actions{ display:flex; gap:10px; margin-top:18px; }
    button{ width:100%; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:800; cursor:pointer; }
    .btnPrimary{ background:var(--primary); color:#fff; }
    .btnPrimary:hover{ background:var(--primaryHover); }
    .btnGhost{ background:transparent; color:var(--text); border:1px solid var(--border); }
    .btnGhost:hover{ background:#F9FAFB; }
    .step{ display:none; }
    .step.active{ display:block; }
    .review{ background:#F9FAFB; border:1px solid #E5E7EB; border-radius:10px; padding:12px; margin-top:12px; font-size:13px; }
    .review .row{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed #E5E7EB; }
    .review .row:last-child{ border-bottom:none; }
    .review .k{ color:var(--muted); }
    .successIcon{ width:52px; height:52px; border-radius:16px; background:rgba(34,197,94,.12); color:#16A34A; display:flex; align-items:center; justify-content:center; font-size:26px; margin:6px auto 10px; border:1px solid rgba(22,163,74,.25); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <div style="font-weight:800;line-height:1">Cursapp</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.1">Onboarding apoderado</div>
      </div>
    </div>

    <div class="card">
      <h1 id="title">Registro Apoderado</h1>
      <p class="subtitle" id="subtitle">Completa los datos para unirte al curso.</p>

      <div class="progressRow" id="progressRow">
        <span id="stepLabel">Paso 1 de 3</span>
        <div class="bar"><div id="barFill"></div></div>
      </div>

      <div class="error" id="errorBox" role="alert"></div>

      <section class="step active" id="step1">
        <label for="colegio">Colegio</label>
        <select id="colegio">
          <option value="">Selecciona colegio</option>
          <option value="Colegio San Martín">Colegio San Martín</option>
          <option value="Colegio Los Andes">Colegio Los Andes</option>
        </select>

        <label for="curso">Curso</label>
        <select id="curso">
          <option value="">Selecciona curso</option>
          <option value="1° Básico A">1° Básico A</option>
          <option value="2° Básico B">2° Básico B</option>
        </select>

        <div class="actions">
          <button class="btnPrimary" type="button" onclick="goNext1()">Continuar</button>
        </div>
      </section>

      <section class="step" id="step2">
        <label for="nombreApoderado">Nombre Apoderado</label>
        <input type="text" id="nombreApoderado" placeholder="Ej: Juan Pérez" />

        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="correo@email.com" />

        <div class="actions">
          <button class="btnGhost" type="button" onclick="goBack2()">Atrás</button>
          <button class="btnPrimary" type="button" onclick="goNext2()">Continuar</button>
        </div>
      </section>

      <section class="step" id="step3">
        <label for="alumno">Nombre del Alumno</label>
        <input type="text" id="alumno" placeholder="Nombre completo del alumno" />
        <p class="hint">Por privacidad, no mostramos lista de alumnos. Ingresa el nombre tal como está registrado en el colegio.</p>

        <div class="checkboxRow">
          <input type="checkbox" id="terminos" />
          <label for="terminos">Acepto términos y condiciones.</label>
        </div>

        <div class="actions">
          <button class="btnGhost" type="button" onclick="goBack3()">Atrás</button>
          <button class="btnPrimary" type="button" onclick="goFinish()">Finalizar</button>
        </div>
      </section>

      <section class="step" id="step4">
        <div class="successIcon">✓</div>
        <h1 style="margin-top:0">Solicitud enviada</h1>
        <p class="subtitle" style="margin-bottom:10px">Revisaremos la información y te agregaremos al curso.</p>
        <div class="review" id="reviewBox"></div>
        <div class="actions" style="margin-top:16px">
          <button class="btnPrimary" type="button" onclick="restart()">Registrar otro apoderado</button>
        </div>
      </section>
    </div>
  </div>

<script>
  function $(id){ return document.getElementById(id); }

  function showError(msg){
    var box = $('errorBox');
    box.textContent = msg;
    box.style.display = 'block';
  }
  function clearError(){
    var box = $('errorBox');
    box.textContent = '';
    box.style.display = 'none';
  }

  function showStep(n){
    clearError();
    $('step1').classList.remove('active');
    $('step2').classList.remove('active');
    $('step3').classList.remove('active');
    $('step4').classList.remove('active');
    $('step'+n).classList.add('active');
    updateHeader(n);
  }

  function updateHeader(step){
    var title = $('title');
    var subtitle = $('subtitle');
    var progressRow = $('progressRow');
    var stepLabel = $('stepLabel');
    var barFill = $('barFill');

    if(step === 1){
      title.textContent = 'Registro Apoderado';
      subtitle.textContent = 'Completa los datos para unirte al curso.';
      progressRow.style.display = 'flex';
      stepLabel.textContent = 'Paso 1 de 3';
      barFill.style.width = '0%';
    } else if(step === 2){
      title.textContent = 'Datos del apoderado';
      subtitle.textContent = 'Usaremos estos datos para notificaciones y pagos.';
      progressRow.style.display = 'flex';
      stepLabel.textContent = 'Paso 2 de 3';
      barFill.style.width = '50%';
    } else if(step === 3){
      title.textContent = 'Datos del alumno';
      subtitle.textContent = 'Esto nos ayuda a asociarte al estudiante correcto.';
      progressRow.style.display = 'flex';
      stepLabel.textContent = 'Paso 3 de 3';
      barFill.style.width = '100%';
    } else {
      progressRow.style.display = 'none';
      title.textContent = '';
      subtitle.textContent = '';
    }
  }

  function validEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  // Inline onclick fallbacks (más compatible con previews/webviews)
  function goNext1(){
    var colegio = $('colegio').value;
    var curso = $('curso').value;
    if(!colegio) return showError('Selecciona un colegio para continuar.');
    if(!curso) return showError('Selecciona un curso para continuar.');
    showStep(2);
  }
  function goBack2(){ showStep(1); }

  function goNext2(){
    var nombre = $('nombreApoderado').value.trim();
    var email = $('email').value.trim();
    if(!nombre) return showError('Ingresa el nombre del apoderado.');
    if(!email) return showError('Ingresa el correo electrónico.');
    if(!validEmail(email)) return showError('El correo no parece válido. Revisa el formato (ej: nombre@correo.com).');
    showStep(3);
  }
  function goBack3(){ showStep(2); }

  function goFinish(){
    var alumno = $('alumno').value.trim();
    var terminos = $('terminos').checked;
    if(!alumno) return showError('Ingresa el nombre del alumno para continuar.');
    if(!terminos) return showError('Debes aceptar los términos y condiciones para finalizar.');

    var review = $('reviewBox');
    review.innerHTML =
      '<div class="row"><div class="k">Colegio</div><div class="v">'+escapeHtml($('colegio').value)+'</div></div>' +
      '<div class="row"><div class="k">Curso</div><div class="v">'+escapeHtml($('curso').value)+'</div></div>' +
      '<div class="row"><div class="k">Apoderado</div><div class="v">'+escapeHtml($('nombreApoderado').value)+'</div></div>' +
      '<div class="row"><div class="k">Correo</div><div class="v">'+escapeHtml($('email').value)+'</div></div>' +
      '<div class="row"><div class="k">Alumno</div><div class="v">'+escapeHtml($('alumno').value)+'</div></div>';

    showStep(4);
  }

  function restart(){
    $('colegio').value = '';
    $('curso').value = '';
    $('nombreApoderado').value = '';
    $('email').value = '';
    $('alumno').value = '';
    $('terminos').checked = false;
    showStep(1);
  }

  // Init
  updateHeader(1);
</script>
</body>
</html>

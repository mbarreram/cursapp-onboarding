<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <link rel="stylesheet" href="assets/styles.css?v=400">

<body>

<header>
  <div class="topbar" style="position:relative;">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <div style="font-weight:950;">Presidente</div>

  </div>

<main class="container" id="app"></main>
<div id="modalRoot"></div>

<nav class="bottomNav">
  <button class="navItem active" data-tab="home">🏠<span>Inicio</span></button>
  <button class="navItem" data-tab="campanas">📌<span>Campañas</span></button>

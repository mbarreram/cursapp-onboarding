<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cursapp · Presidente</title>

  <!-- CSS global base -->
  <link rel="stylesheet" href="assets/styles.css?v=400">
  <!-- CSS específico presidente -->
  <link rel="stylesheet" href="assets/presidente.css?v=3">
</head>
<body>

<header>
  <div class="topbar" style="position:relative;">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <div style="font-weight:950;">Presidente</div>
        <div class="muted" style="font-size:12px;font-weight:800;">
          Curso Demo · Colegio Demo
        </div>
      </div>
    </div>

    <button
      class="btn ghost"
      id="menuBtn"
      type="button"
      style="position:absolute;right:16px;top:10px;z-index:10001;">
      ☰
    </button>

    <div
      id="menuDropdown"
      style="display:none;position:absolute;right:16px;top:56px;
      background:#fff;border:1px solid rgba(229,231,235,.9);
      border-radius:14px;padding:8px;min-width:220px;
      box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:10002;">
      <button class="btn ghost" id="resetBtn" style="width:100%;text-align:left;">
        Reset datos (demo)
      </button>
      <button class="btn ghost" id="logoutBtn" style="width:100%;text-align:left;">
        Cerrar sesión
      </button>
    </div>
  </div>
</header>

<main class="container" id="app"></main>
<div id="modalRoot"></div>

<nav class="bottomNav">
  <button class="navItem active" data-tab="home">
    🏠<span>Inicio</span>
  </button>
  <button class="navItem" data-tab="campanas">
    📌<span>Campañas</span>
  </button>
  <button class="navItem" data-tab="informes">
    📄<span>Informes</span>
  </button>
</nav>

<script src="assets/presidente.js?v=3"></script>
</body>
</html>

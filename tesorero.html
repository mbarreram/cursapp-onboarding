  <title>Cursapp · Tesorero</title>

  <!-- CSS base + Tesorero V60 -->
  <link rel="stylesheet" href="/assets/styles.css?v=400">

<body class="cursapp-app-shell cursapp-tesorero">

<header class="tesPremiumHeader" aria-label="Cabecera tesorero">

    <div class="tesHeaderAvatar" aria-hidden="true">T</div>
    <div class="tesHeaderText">
      <div class="tesHeaderName">Tesorero</div>
      <div class="tesHeaderRole">Gestión financiera del curso</div>
      <div class="tesHeaderCourse">2°B · Colegio Central</div>

      <span class="tesBell">🔔</span>
      <span class="tesBadge" id="tesHeaderBadge">1</span>
    </button>
    <button class="tesHeaderBtn" id="menuBtn" type="button" aria-label="Menú">☰</button>

    <div id="menuDropdown" class="tesMenuDropdown" style="display:none;"></div>
  </div>
</header>

<main class="container" id="app"></main>
<div id="modalRoot"></div>

<nav class="bottomNav tesBottomNav" aria-label="Navegación tesorero">
  <button class="navItem active" data-tab="home" type="button"><span class="tesNavIcon">⌂</span><span class="tesNavLabel">Inicio</span></button>
  <button class="navItem" data-tab="conciliacion" type="button"><span class="tesNavIcon">◉</span><span class="tesNavLabel">Conciliar</span></button>

</nav>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>MiCursoX · Verificación bancaria</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.08)}.logo{width:58px;height:58px;border-radius:18px;background:#f3e8ff;display:grid;place-items:center;font-weight:950;font-size:28px;color:#6d28d9;margin-bottom:20px}.title{font-size:30px;line-height:1.08;margin:0 0 10px;font-weight:950}.text{color:#64748b;font-size:17px;line-height:1.5;font-weight:650;margin:0}.course{margin-top:18px;padding:16px;border-radius:18px;background:#f8fafc;border:1px solid #e2e8f0;font-weight:850}.btn{width:100%;border:0;border-radius:18px;padding:16px;margin-top:22px;background:#6d28d9;color:#fff;font:inherit;font-weight:900;font-size:17px}.error{color:#b42318;background:#fef2f2;border:1px solid #fecaca;padding:14px 16px;border-radius:16px;margin-top:16px;font-weight:800}.spinner{width:42px;height:42px;border:4px solid #ede9fe;border-top-color:#6d28d9;border-radius:50%;animation:spin .8s linear infinite;margin:22px auto}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card" id="verifyCard">
    <div class="logo">C</div>
    <h1 class="title">Verificando cuenta bancaria</h1>
    <p class="text">Estamos validando el enlace y el curso al que pertenece esta solicitud.</p>
    <div class="spinner" aria-label="Cargando"></div>
  </main>
  <script src="/assets/supabase-config.js?v=2"></script>
  <script src="/assets/config.js?v=1"></script>
  <script src="/assets/bank-verify-page.js?v=1"></script>
</body>
</html>

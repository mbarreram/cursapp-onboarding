<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Presidente | Cursapp</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    :root{ --tabbar-h:96px; }
    .container{ padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
    .section{ padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <div class="brandTitle">Cursapp</div>
        <div class="who">Presidente (Demo)</div>
      </div>
    </div>
    <button class="btn" onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<div class="container">

  <h1>Inicio</h1>
  <p class="muted">Administración del curso y recaudaciones.</p>

  <!-- TAREAS -->
  <div class="card">
    <h2>Crear tarea de recaudación</h2>
    <form id="taskForm">
      <label>Nombre</label>
      <input id="taskName" placeholder="Ej: Rifa del huevo" required>
      <label>Monto</label>
      <input id="taskAmount" type="number" placeholder="Ej: 2000" required>
      <label>Fecha límite</label>
      <input id="taskDue" type="date" required>
      <button class="btn primary" type="submit">Crear tarea</button>
    </form>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2>Tareas del curso</h2>
    <table>
      <thead>
        <tr><th>Tarea</th><th>Monto</th><th>Límite</th></tr>
      </thead>
      <tbody id="tasksTable"></tbody>
    </table>
  </div>

</div>

<div class="tabbar">
  <div class="tabbarInner">
    <button class="tab active">🏠 Inicio</button>
    <button class="tab">💳 Pagos</button>
    <button class="tab">✅ Retiros</button>
    <button class="tab">👤 Perfil</button>
  </div>
</div>

<script>
const LS_TASKS = 'cursapp_tasks_v1';
const LS_PAY = 'cursapp_course_payments_v1';
const LS_ROSTER = 'cursapp_guardians_roster_v1';

function load(key, fb){ try{return JSON.parse(localStorage.getItem(key))||fb}catch(e){return fb}}
function save(key,v){ localStorage.setItem(key, JSON.stringify(v)); }

function ensureRoster(){
  let r = load(LS_ROSTER, []);
  if(!r.length){
    r = ['Ana Soto','Carlos Díaz','María Pérez','José Rivas'];
    save(LS_ROSTER, r);
  }
  return r;
}

function render(){
  const tasks = load(LS_TASKS, []);
  const tb = document.getElementById('tasksTable');
  tb.innerHTML = tasks.length ? tasks.map(t=>`
    <tr><td>${t.name}</td><td>$${t.amount}</td><td>${t.due}</td></tr>
  `).join('') : '<tr><td colspan="3">Sin tareas</td></tr>';
}

document.getElementById('taskForm').onsubmit = e =>{
  e.preventDefault();
  const name = taskName.value.trim();
  const amount = Number(taskAmount.value);
  const due = taskDue.value;

  const tasks = load(LS_TASKS, []);
  tasks.unshift({ id:Date.now(), name, amount, due });
  save(LS_TASKS, tasks);

  const roster = ensureRoster();
  const pays = load(LS_PAY, []);
  roster.forEach(n=>{
    pays.unshift({ type:'task', name:n, concept:name, amount, status:'pending', date:'-' });
  });
  save(LS_PAY, pays);

  taskName.value=''; taskAmount.value=''; taskDue.value='';
  render();
};

function logout(){
  localStorage.removeItem('cursapp_demo_user');
  location.href='login.html';
}

render();
</script>

</body>
</html>

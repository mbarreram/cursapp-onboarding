<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cursapp | Presidente</title>
</head>
<body>

<h1>Dashboard Presidente</h1>
<p>Rol: Presidente del curso</p>

<nav>
  <ul>
    <li>Inicio</li>
    <li>Pagos del curso</li>
    <li>Retiros</li>
    <li>Tareas del curso</li>
  </ul>
</nav>

<section>
  <h2>Tareas del curso</h2>
  <p>Aquí el presidente puede crear tareas de recaudación.</p>
</section>


<script>
/* ============================
   Cursapp Patch: Presidente
   - Guardar tareas como catálogo global
   - Generar cobros para todos los apoderados
   ============================ */
(function(){
  const LS_TASKS = 'cursapp_tasks_v1';
  const LS_PAY = 'cursapp_course_payments_v1';
  const LS_ROSTER = 'cursapp_guardians_roster_v1';

  function loadJSON(key, fb){
    try { return JSON.parse(localStorage.getItem(key) || 'null') ?? fb; } catch(e){ return fb; }
  }
  function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  function ensureRoster(){
    let r = loadJSON(LS_ROSTER, null);
    if (!Array.isArray(r) || r.length === 0){
      r = ['Apoderado Demo'];
      saveJSON(LS_ROSTER, r);
    }
    return r;
  }

  window.__createTaskAndPayments = function(name, amount, due){
    // 1) Save task catalog
    const tasks = loadJSON(LS_TASKS, []);
    tasks.unshift({ id:'t_'+Math.random().toString(16).slice(2,8), name, amount:Number(amount), due });
    saveJSON(LS_TASKS, tasks);

    // 2) Generate payments for all guardians
    const roster = ensureRoster();
    const pays = loadJSON(LS_PAY, []);
    const today = new Date().toISOString().slice(0,10);

    roster.forEach(guardian => {
      pays.unshift({
        type:'task',
        name: guardian,
        concept: name,
        amount:Number(amount),
        status:'pending',
        date:'-',
        createdAt: today
      });
    });
    saveJSON(LS_PAY, pays);
  };
})();
</script>


<script>
/* ============================
   FINAL PATCH (Presidente)
   Garantiza:
   - Tareas en cursapp_tasks_v1 (catálogo)
   - Cobros por tarea en cursapp_course_payments_v1 con type:"task"
   ============================ */
(function(){
  const LS_TASKS = 'cursapp_tasks_v1';
  const LS_PAY = 'cursapp_course_payments_v1';
  const LS_ROSTER = 'cursapp_guardians_roster_v1';

  function loadJSON(key, fb){
    try { return JSON.parse(localStorage.getItem(key) || 'null') ?? fb; } catch(e){ return fb; }
  }
  function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  function ensureRoster(){
    let roster = loadJSON(LS_ROSTER, null);
    if (!Array.isArray(roster) || roster.length === 0){
      roster = [
        'Ana Soto','Carlos Díaz','María Pérez','José Rivas','Paula Muñoz','Felipe Torres',
        'Camila Fuentes','Diego Herrera','Valentina Vega','Ignacio Silva','Constanza Lara','Ricardo Núñez'
      ];
      saveJSON(LS_ROSTER, roster);
    }
    return roster;
  }

  function ensurePayments(){
    let rows = loadJSON(LS_PAY, null);
    if (!Array.isArray(rows)) rows = [];
    saveJSON(LS_PAY, rows);
    return rows;
  }

  function ensureTasks(){
    let tasks = loadJSON(LS_TASKS, null);
    if (!Array.isArray(tasks)) tasks = [];
    saveJSON(LS_TASKS, tasks);
    return tasks;
  }

  function normalizeTaskPayments(){
    const tasks = ensureTasks();
    if (!tasks.length) return;

    const roster = ensureRoster();
    const rows = ensurePayments();
    const today = new Date().toISOString().slice(0,10);

    tasks.forEach(task => {
      const taskName = task.name || task.nombre || task.title;
      const amount = Number(task.amount || task.monto || 0);
      if (!taskName || !amount) return;

      roster.forEach((guardianName, idx) => {
        const exists = rows.some(r =>
          r.type === 'task' &&
          r.concept === taskName &&
          r.name === guardianName
        );
        if (exists) return;

        rows.unshift({
          type: 'task',
          name: guardianName,
          concept: taskName,
          amount: amount,
          status: 'pending',
          date: '-',
          createdAt: today
        });
      });
    });

    saveJSON(LS_PAY, rows);
  }

  // Re-normaliza al cargar
  normalizeTaskPayments();

  // Re-normaliza después de crear tarea (escuchando submit en captura, luego dejamos que handler existente haga lo suyo)
  const form = document.getElementById('taskForm');
  if (form){
    form.addEventListener('submit', function(){
      // esperamos a que el handler original guarde la tarea
      setTimeout(normalizeTaskPayments, 0);
    }, true);
  }
})();
</script>

</body>
</html>

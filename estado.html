<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Estado de pagos · MiCursoX">
  <meta property="og:description" content="Revisa de forma privada el estado actualizado de pagos del alumno.">
  <meta property="og:image" content="https://micursox.cl/assets/brand/micursox-icon-192-v4.png">
  <meta property="og:image:width" content="192">
  <meta property="og:image:height" content="192">
  <meta property="og:site_name" content="MiCursoX">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Estado de pagos · MiCursoX">
  <meta name="twitter:description" content="Revisa de forma privada el estado actualizado de pagos del alumno.">
  <meta name="twitter:image" content="https://micursox.cl/assets/brand/micursox-icon-192-v4.png">
  <title>Estado de pagos · MiCursoX</title>
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--violet:#6d28d9;--soft:#f8fafc;--danger:#dc2626;--amber:#b45309;--green:#15803d}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f8f7ff 0,#f8fafc 45%,#fff 100%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .wrap{width:min(760px,100%);margin:0 auto;padding:24px 18px 56px}
    .brand{display:flex;justify-content:center;margin:8px 0 22px}.brand img{width:190px;max-width:58vw;height:auto}
    .hero,.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 34px rgba(15,23,42,.06)}
    .hero{padding:24px;position:relative}.closeBtn{position:absolute;top:16px;right:16px;border:1px solid var(--line);background:#fff;color:#6d28d9;border-radius:14px;padding:9px 13px;font-weight:900;font-size:14px;box-shadow:0 8px 18px rgba(15,23,42,.06);cursor:pointer}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--violet);text-transform:uppercase}.hero h1{font-size:30px;line-height:1.08;margin:8px 0}.sub{color:var(--muted);font-weight:700;line-height:1.4}
    .summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
    .metric{padding:18px;border-radius:20px;background:#fff;border:1px solid var(--line)}.metric strong{display:block;font-size:24px;margin-top:6px}.metric small{font-weight:850;color:var(--muted)}.metric.main{grid-column:1/-1;background:#fff7f7;border-color:#fecaca}.metric.main strong{font-size:30px;color:#b91c1c}
    .metric.overdue{background:#fff7ed;border-color:#fed7aa}.metric.overdue strong{color:#c2410c}.metric.upcoming{background:#eff6ff;border-color:#bfdbfe}.metric.upcoming strong{color:#1d4ed8}.metric.voluntary{grid-column:1/-1;background:#faf5ff;border-color:#e9d5ff}.metric.voluntary strong{color:#6d28d9}
    .sectionTitle{font-size:20px;font-weight:950;margin:26px 2px 12px}
    .campaign{padding:18px;margin:12px 0}.campaignHead{display:flex;gap:12px;align-items:flex-start}.ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#f5f3ff;font-size:24px;flex:0 0 44px}.campaignHead h2{margin:0;font-size:20px;line-height:1.15}.tag{display:inline-flex;margin-top:6px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#fee2e2;color:#991b1b}.tag.vol{background:#ede9fe;color:#6d28d9}.tag.ok{background:#dcfce7;color:#166534}
    .amountRow{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.amountRow span{color:var(--muted);font-weight:800}.amountRow b{font-size:22px}
    details{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--violet);font-weight:900}.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9}.line:last-child{border-bottom:0}.line div:first-child{min-width:0}.line b{white-space:nowrap}.status{font-size:12px;font-weight:850;margin-top:3px}.status.overdue{color:#dc2626}.status.upcoming{color:#2563eb}.status.paid{color:#15803d}.status.no{color:#64748b}
    .note{margin-top:12px;padding:12px 14px;border-radius:14px;background:#faf5ff;color:#6b21a8;font-weight:750;line-height:1.4}.privacy{margin:24px 0 0;padding:16px;border-radius:18px;background:#f8fafc;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.5}
    .state{padding:32px 22px;text-align:center}.state h1{font-size:26px;margin:8px 0}.state p{color:var(--muted);line-height:1.5}.shield{font-size:44px}
    .updated{text-align:center;color:#94a3b8;font-size:12px;margin-top:18px}
    @media(max-width:520px){.wrap{padding:18px 14px 44px}.hero{padding:20px}.hero h1{font-size:26px}.summary{grid-template-columns:1fr}.metric,.metric.main,.metric.voluntary{grid-column:1}.metric.main strong{font-size:27px}.campaign{padding:16px}.amountRow{align-items:flex-start;flex-direction:column}.amountRow b{font-size:21px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><img src="/assets/brand/micursox-compact.svg" alt="MiCursoX"></div>
    <div id="app" class="card state"><div class="shield">🔐</div><h1>Cargando estado de pagos…</h1><p>Estamos validando tu enlace privado.</p></div>
  </main>
  <script src="/assets/supabase-config.js?v=20261005"></script>
  <script>
  (function(){
    const app=document.getElementById("app");
    const qs=new URLSearchParams(location.search);
    const token=String(qs.get("t")||"").trim();
    const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const clp=n=>"$"+Math.max(0,Math.round(Number(n||0)||0)).toLocaleString("es-CL");
    const icon=title=>{const t=String(title||"").toLowerCase();if(t.includes("huevo"))return"🥚";if(t.includes("rifa"))return"🎟️";if(t.includes("gala"))return"🎓";if(t.includes("traje"))return"👕";if(t.includes("conviv"))return"🎉";return"📌"};
    const fmtDate=v=>{try{return new Intl.DateTimeFormat("es-CL",{dateStyle:"long",timeZone:"America/Santiago"}).format(new Date(v))}catch(_){return""}};

    function state(title,message,ico){
      app.className="card state";
      app.innerHTML='<div class="shield">'+esc(ico||"🔒")+'</div><h1>'+esc(title)+'</h1><p>'+esc(message)+'</p>';
    }

    function render(data){
      const s=data.summary||{}, campaigns=Array.isArray(data.campaigns)?data.campaigns:[];
      const mandatory=campaigns.filter(c=>c.mandatory);
      const voluntary=campaigns.filter(c=>!c.mandatory);
      const course=[data.course?.level,data.course?.letter,data.course?.year].filter(Boolean).join(" ");
      app.className="";
      app.innerHTML=
        '<section class="hero">'+
          '<button class="closeBtn" type="button" data-close>✕ Cerrar</button>'+
          '<div class="eyebrow">Estado privado de pagos</div>'+
          '<h1>'+esc(data.student?.name||"Alumno/a")+'</h1>'+
          '<div class="sub">'+esc(data.course?.school||"Colegio")+(course?' · '+esc(course):'')+'</div>'+
        '</section>'+
        '<section class="summary">'+
          '<div class="metric main"><small>💳 Para quedar al día hoy</small><strong>'+clp(s.mandatory_due_now)+'</strong><div class="sub">Solo compromisos obligatorios pendientes.</div></div>'+
          '<div class="metric overdue"><small>⏰ Atrasado</small><strong>'+clp(s.overdue)+'</strong></div>'+
          '<div class="metric upcoming"><small>📅 Por vencer / pendiente</small><strong>'+clp(s.upcoming)+'</strong></div>'+
          (Number(s.voluntary_projected||0)>0?'<div class="metric voluntary"><small>🎓 Aporte voluntario proyectado</small><strong>'+clp(s.voluntary_projected)+'</strong><div class="sub">No corresponde a deuda obligatoria inmediata.</div></div>':'')+
        '</section>'+
        '<div class="sectionTitle">📋 Compromisos obligatorios</div>'+
        (mandatory.length?mandatory.map(renderMandatory).join(""):'<section class="card campaign"><div class="campaignHead"><div class="ico">✅</div><div><h2>Sin pagos obligatorios pendientes</h2><div class="tag ok">Al día</div></div></div></section>')+
        (voluntary.length?'<div class="sectionTitle">💜 Aportes voluntarios / proyectados</div>'+voluntary.map(renderVoluntary).join(""):'')+
        '<div class="privacy">🔒 Este enlace muestra únicamente el estado de pagos de este alumno. No permite realizar cambios ni acceder a información de otros alumnos. Caduca automáticamente el <b>'+esc(fmtDate(data.expires_at))+'</b>.</div>'+
        '<div class="updated">Información consultada el '+esc(fmtDate(data.generated_at))+'.</div>';
      const closeBtn=app.querySelector('[data-close]');
      if(closeBtn) closeBtn.addEventListener('click',()=>{
        try{
          if(history.length>1){ history.back(); return; }
        }catch(_){}
        try{ window.close(); }catch(_){}
        setTimeout(()=>{ location.href='https://micursox.cl'; },120);
      });
    }

    function renderMandatory(c){
      const details=Array.isArray(c.details)?c.details:[];
      return '<section class="card campaign">'+
        '<div class="campaignHead"><div class="ico">'+icon(c.title)+'</div><div><h2>'+esc(c.title)+'</h2><div class="tag '+(c.pending_amount>0?'':'ok')+'">'+(c.pending_amount>0?'Obligatoria · pendiente':'Obligatoria · al día')+'</div></div></div>'+
        '<div class="amountRow"><span>'+(c.pending_amount>0?'Monto pendiente':'Estado')+'</span><b>'+(c.pending_amount>0?clp(c.pending_amount):'✅ Al día')+'</b></div>'+
        (details.length?'<details><summary>Ver meses / vencimientos ('+details.length+')</summary>'+details.map(d=>'<div class="line"><div><strong>'+esc(d.label||"Pago pendiente")+'</strong><div class="status '+esc(d.status)+'">'+esc(d.status_label||"Pendiente")+(d.due_date?' · vence '+esc(d.due_date):' · sin fecha de vencimiento informada')+'</div></div><b>'+clp(d.amount)+'</b></div>').join("")+'</details>':'')+
      '</section>';
    }

    function renderVoluntary(c){
      const plan=Array.isArray(c.plan)?c.plan:[];
      return '<section class="card campaign">'+
        '<div class="campaignHead"><div class="ico">'+icon(c.title)+'</div><div><h2>'+esc(c.title)+'</h2><div class="tag vol">Voluntaria / proyectada</div></div></div>'+
        '<div class="amountRow"><span>Saldo proyectado del plan</span><b>'+clp(c.projected_remaining)+'</b></div>'+
        '<div class="note">Aporte sugerido: <b>'+clp(c.amount)+'</b>'+(c.months>1?' por '+c.months+' meses':'')+'. Pagado registrado: <b>'+clp(c.paid_amount)+'</b>. Este saldo no se considera deuda obligatoria hoy.</div>'+
        (plan.length?'<details><summary>Ver plan mensual</summary>'+plan.map(d=>'<div class="line"><div><strong>'+esc(d.label)+'</strong><div class="status '+(d.status==="paid"?"paid":"no")+'">'+esc(d.status_label)+'</div></div><b>'+clp(d.amount)+'</b></div>').join("")+'</details>':'')+
      '</section>';
    }

    async function load(){
      if(!token){state("Enlace inválido","Solicita un nuevo enlace a la directiva del curso.","⚠️");return}
      const cfg=window.CURSAPP_SUPABASE||{};
      try{
        const res=await fetch(cfg.url+"/functions/v1/student-payment-share",{
          method:"POST",
          headers:{"Content-Type":"application/json","apikey":cfg.publishableKey},
          body:JSON.stringify({action:"view",token})
        });
        const body=await res.json().catch(()=>({}));
        if(res.status===410 || body.code==="expired"){state("Enlace vencido","Este enlace temporal venció. Debes volver a solicitarlo a la directiva.","⏳");return}
        if(!res.ok || !body?.data){state("No pudimos abrir este enlace","Solicita un nuevo enlace a la directiva del curso.","⚠️");return}
        render(body.data);
      }catch(_){state("No pudimos cargar el detalle","Revisa tu conexión e intenta nuevamente.","📶")}
    }
    load();
  })();
  </script>
</body>
</html>

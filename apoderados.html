<body class="cursapp-app-shell cursapp-presidente">
  <header>
    <div class="topbar" style="position:relative;">
      <div class="brand">
        <div class="logo">C</div>
        <div id="whoLine"></div>
      </div>

      <button id="menuBtn">☰</button>
      <div id="menuDropdown" style="display:none;"></div>
    </div>
  </header>

  <div class="container" id="app"></div>
  <div id="modalRoot"></div>

  <nav class="bottomNav">
    <button class="navItem active" data-tab="home">🏠<span>Inicio</span></button>
    <button class="navItem" data-tab="campanas">📌<span>Campañas</span></button>
    <button class="navItem" data-tab="deudores">🧾<span>Deudores</span></button>
    <button class="navItem" data-tab="informes">📄<span>Informes</span></button>
  </nav>

  <script>
    // volver al home correcto según rol
    window.__goBackHome = function(){
      try{
        const u = JSON.parse(localStorage.getItem("cursapp_demo_user") || "null");
        const role = (u && u.role) ? String(u.role).toLowerCase() : "";
        if(role === "presidente") return location.assign("/presidente.html");
        if(role === "tesorero") return location.assign("/tesorero.html");
        return location.assign("/index.html");
      }catch(e){
        location.assign("/index.html");
      }
    };
  </script>

  <script defer src="/assets/micursox-desktop-shell.js?v=1"></script>
  <script defer src="/assets/supabase-config.js?v=2"></script>
  <script defer src="/assets/core.js?v=5818"></script>

</body>
